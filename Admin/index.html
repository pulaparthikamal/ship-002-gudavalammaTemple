<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        const storageKey = 'persist:root'
        const root = document.documentElement
        const defaultTheme = 'light'
        const defaultPrimaryColor = '#2563eb'

        const getSystemTheme = () =>
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'

        const resolveTheme = (themePreference) =>
          themePreference === 'system' ? getSystemTheme() : themePreference

        const normalizeHexColor = (value, fallback = defaultPrimaryColor) => {
          if (!value) {
            return fallback
          }

          const trimmed = String(value).trim()
          const prefixed = trimmed.startsWith('#') ? trimmed : `#${trimmed}`
          const shortHexMatch = /^#([\da-fA-F]{3})$/.exec(prefixed)

          if (shortHexMatch) {
            return `#${shortHexMatch[1]
              .split('')
              .map((channel) => `${channel}${channel}`)
              .join('')}`.toLowerCase()
          }

          return /^#[\da-fA-F]{6}$/.test(prefixed) ? prefixed.toLowerCase() : fallback
        }

        const hexToRgb = (hex) => {
          const normalized = normalizeHexColor(hex)
          const parsed = Number.parseInt(normalized.slice(1), 16)

          return {
            r: (parsed >> 16) & 255,
            g: (parsed >> 8) & 255,
            b: parsed & 255,
          }
        }

        const clampChannel = (value) => Math.max(0, Math.min(255, Math.round(value)))

        const rgbToHex = (red, green, blue) =>
          `#${[red, green, blue]
            .map((channel) => clampChannel(channel).toString(16).padStart(2, '0'))
            .join('')}`

        const mixHexColors = (baseHex, targetHex, weight) => {
          const base = hexToRgb(baseHex)
          const target = hexToRgb(targetHex)

          return rgbToHex(
            base.r + (target.r - base.r) * weight,
            base.g + (target.g - base.g) * weight,
            base.b + (target.b - base.b) * weight,
          )
        }

        const getRelativeLuminance = (hex) => {
          const { r, g, b } = hexToRgb(hex)
          const channels = [r, g, b].map((channel) => {
            const normalized = channel / 255
            return normalized <= 0.03928
              ? normalized / 12.92
              : ((normalized + 0.055) / 1.055) ** 2.4
          })

          return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722
        }

        const getContrastRatio = (firstHex, secondHex) => {
          const first = getRelativeLuminance(firstHex)
          const second = getRelativeLuminance(secondHex)
          const lighter = Math.max(first, second)
          const darker = Math.min(first, second)

          return (lighter + 0.05) / (darker + 0.05)
        }

        const getAccessibleTextColor = (backgroundHex) =>
          getContrastRatio(backgroundHex, '#ffffff') >= getContrastRatio(backgroundHex, '#050505')
            ? '#ffffff'
            : '#050505'

        const applyPrimaryTheme = (primaryColorValue, resolvedTheme) => {
          const primaryColor = normalizeHexColor(primaryColorValue)
          const { r, g, b } = hexToRgb(primaryColor)

          root.style.setProperty('--primary-color', primaryColor)
          root.style.setProperty(
            '--primary-color-hover',
            mixHexColors(primaryColor, resolvedTheme === 'dark' ? '#ffffff' : '#000000', resolvedTheme === 'dark' ? 0.14 : 0.12),
          )
          root.style.setProperty(
            '--primary-color-active',
            mixHexColors(primaryColor, resolvedTheme === 'dark' ? '#ffffff' : '#000000', resolvedTheme === 'dark' ? 0.24 : 0.2),
          )
          root.style.setProperty('--primary-color-soft', `rgba(${r}, ${g}, ${b}, ${resolvedTheme === 'dark' ? 0.18 : 0.12})`)
          root.style.setProperty('--primary-color-ring', `rgba(${r}, ${g}, ${b}, ${resolvedTheme === 'dark' ? 0.28 : 0.2})`)
          root.style.setProperty('--primary-color-contrast', getAccessibleTextColor(primaryColor))
          root.style.setProperty('--primary-color-rgb', `${r} ${g} ${b}`)
        }

        try {
          const persistedRoot = window.localStorage.getItem(storageKey)
          const parsedRoot = persistedRoot ? JSON.parse(persistedRoot) : null
          const persistedPreferences = parsedRoot?.preferences
          const parsedPreferences =
            typeof persistedPreferences === 'string'
              ? JSON.parse(persistedPreferences)
              : persistedPreferences
          const themePreference =
            parsedPreferences?.theme === 'dark' ||
            parsedPreferences?.theme === 'light' ||
            parsedPreferences?.theme === 'system'
              ? parsedPreferences.theme
              : defaultTheme
          const primaryColor = normalizeHexColor(parsedPreferences?.primaryColor, defaultPrimaryColor)
          const resolvedTheme = resolveTheme(themePreference)

          root.dataset.theme = resolvedTheme
          root.dataset.themePreference = themePreference
          root.style.colorScheme = resolvedTheme
          root.style.backgroundColor = resolvedTheme === 'dark' ? '#050505' : '#f5f5f5'
          applyPrimaryTheme(primaryColor, resolvedTheme)
        } catch {
          root.dataset.theme = defaultTheme
          root.dataset.themePreference = defaultTheme
          root.style.colorScheme = defaultTheme
          root.style.backgroundColor = '#f5f5f5'
          applyPrimaryTheme(defaultPrimaryColor, defaultTheme)
        }
      })()
    </script>
    <title>Admin React Starter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
